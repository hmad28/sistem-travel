name: hammad-tour-os

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hammad_tour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hammad_tour}
      POSTGRES_DB: ${POSTGRES_DB:-hammad_tour}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ['dev', 'seed']
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hammad_tour}:${POSTGRES_PASSWORD:-hammad_tour}@postgres:5432/${POSTGRES_DB:-hammad_tour}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-random-secret-at-least-32-characters}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@hammadtour.id}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-change-this-password}
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm db:migrate

  seed:
    profiles: ['seed']
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hammad_tour}:${POSTGRES_PASSWORD:-hammad_tour}@postgres:5432/${POSTGRES_DB:-hammad_tour}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-random-secret-at-least-32-characters}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@hammadtour.id}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-change-this-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: pnpm db:seed:demo

  minio:
    profiles: ['storage']
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-hammad-tour-postgres-data}
  minio-data:
    name: ${MINIO_DATA_VOLUME:-hammad-tour-minio-data}
